[package]
name = "gh-img-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "gh_img"

[dependencies]
base64 = "0.23"
form_urlencoded = "1"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# unwind, so a decoder panic fails one request instead of the whole service
panic = "unwind"

[profile.test]
overflow-checks = true
